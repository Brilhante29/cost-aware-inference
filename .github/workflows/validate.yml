name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run tests and reproduce contracts
        run: python tools/validate-runtime.py
      - name: Validate Docker path
        run: |
          docker build -t cost-aware-inference .
          docker run --rm cost-aware-inference > docker-result.json
          python tools/validate-benchmark.py docker-result.json
